sample:
  description: Micro Speech sample for Seeed XIAO BLE Sense (nRF52840) using onboard PDM microphone
  name: micro speech xiao
common:
  tags:
    - tensorflow
    - audio
    - ml
  build_only: true
  modules:
    - tflite-micro
  harness: console
  harness_config:
    type: multi_line
    ordered: false
    regex:
      - "Detected: (yes|no|silence|unknown)"
tests:
  sample.tensorflow.micro_speech_xiao:
    integration_platforms:
      - xiao_ble/nrf52840/sense
    platform_allow:
      - xiao_ble/nrf52840/sense
