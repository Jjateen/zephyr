# Enable hardware FPU (Cortex-M4F) — avoids ~50x penalty from soft-float emulation
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Use ARM CMSIS-NN optimized kernels instead of reference C implementations
# Replaces Conv2D/FC/Pooling with SIMD-accelerated versions → ~10-100x faster inference
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y

# TFLite Micro
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_TENSORFLOW_LITE_MICRO=y
# stack size needed to safely initialize
# and run TensorFlow Lite Micro operations
# in the main thread
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_REQUIRES_FLOAT_PRINTF=y

# PDM microphone via Zephyr audio/dmic API
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# USB CDC ACM for serial output (same as hello_world setup)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
